spring:
  # Flyway 가 스키마 주인(src/main/resources/db/migration/V*.sql). 하이버네이트는 검사만.
  datasource:
    url: jdbc:postgresql://localhost:5432/recon
    username: recon
    password: recon
  jpa:
    hibernate:
      ddl-auto: validate   # 생성/변경 금지. 엔티티 ↔ Flyway 스키마 불일치 시 부팅 실패.
    open-in-view: false
  flyway:
    enabled: true
